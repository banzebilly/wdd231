<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Thank you for applying for membership with the Johannesburg Chamber of Commerce."
    >

    <meta
        name="author"
        content="Banze Billy"
    >

    <title>Thank You | Johannesburg Chamber of Commerce</title>

    <link rel="stylesheet" href="styles/chamber.css">
    <link rel="stylesheet" href="styles/small-chamber.css">

    <script type="module" src="scripts/main.mjs"></script>
    <script type="module" src="scripts/thankyou.mjs"></script>

</head>


<body>

<header>

    <!-- Use your same header from join.html -->

</header>


<main class="thank-you-page">

    <section class="thank-you">

        <p>Membership application</p>

        <h1>Thank You!</h1>

        <p>
            Thank you for applying to join the
            Johannesburg Chamber of Commerce.
        </p>

        <div class="application-summary">

            <h2>Application information</h2>

            <p>
                <strong>First name:</strong>
                <span id="display-first-name"></span>
            </p>

            <p>
                <strong>Last name:</strong>
                <span id="display-last-name"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="display-email"></span>
            </p>

            <p>
                <strong>Mobile phone:</strong>
                <span id="display-phone"></span>
            </p>

            <p>
                <strong>Business:</strong>
                <span id="display-business"></span>
            </p>

            <p>
                <strong>Application submitted:</strong>
                <span id="display-timestamp"></span>
            </p>

        </div>

    </section>

</main>


<footer>

    <!-- Use your same footer -->

</footer>

</body>
</html>
